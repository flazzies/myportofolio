<form method="post" action="{% url 'main:toggle_endorse' skill.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in skill.endorsed_by.all %} is-starred{% endif %}"
            title="{% if skill.endorsed_by.all %}Diendorse oleh {{ skill.endorsed_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">👍</span>
        {% if user in skill.endorsed_by.all %}Unendorse{% else %}Endorse{% endif %}
        <span class="star-count">{{ skill.endorsed_by.count }}</span>
    </button>
</form>
